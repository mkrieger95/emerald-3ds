name: CI

on:
  push:
  pull_request:

jobs:
  release-versions:
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.versions.outputs.python }}
      pillow: ${{ steps.versions.outputs.pillow }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        name: Read the Python and Pillow release pins
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path

          python = tomllib.loads(Path("upstream.lock").read_text(encoding="utf-8"))["python"]
          version = python["image"].removeprefix("python:").split("-", 1)[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"python={version}", f"pillow={python['pillow']}", sep="\n", file=output)

  audit-and-python:
    needs: release-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "${{ needs.release-versions.outputs.python }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the release Pillow version
        env:
          PILLOW: ${{ needs.release-versions.outputs.pillow }}
        run: python -m pip install "Pillow==$PILLOW"
      - name: Publication audit
        run: python tools/release_audit.py --repo . --strict
      - name: Byte-compile all Python
        run: python -m compileall -q builder tools 3ds_port/scripts 3ds_port/tests
      - name: Builder tests (synthetic data, no ROM)
        run: python -m unittest discover -s builder/tests -v
      - name: Synthetic web payload passes the release contract audit
        run: |
          python tools/build_web_payload.py --synthetic synthetic-web
          python tools/release_audit.py --zip synthetic-web/Emerald3DS-WebPayload.zip --strict --web-payload

  host-tests:
    needs: release-versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.release-versions.outputs.python }}
      - name: Data pack parser against the builder's writer
        run: |
          gcc -std=c99 -O2 -Wall -Wextra -Werror -I3ds_port/include \
              3ds_port/tests/pak_test.c 3ds_port/src/3ds_pak.c -o pak_test
          ./pak_test test.pak "$(python 3ds_port/tests/make_test_pak.py test.pak)"
      - name: Input and video decoding
        run: |
          cd 3ds_port
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/input_test.c src/3ds_input_decode.c -o input_test && ./input_test
          gcc -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tests/video_decode_test.c src/3ds_video_decode.c -o video_test && ./video_test
      - name: Day/night clock and lighting
        run: make -C 3ds_port verify-daynight verify-clock-store verify-encounters verify-night-lamps
      - name: Standalone voxel shadows and mesh fixtures
        run: |
          make -C 3ds_port verify-voxel-lighting verify-voxel-trees build/voxel_ground_mesh_test.exe
          cd 3ds_port
          ./build/voxel_ground_mesh_test.exe
      - name: Night window masks and building-page compatibility
        env:
          PILLOW: ${{ needs.release-versions.outputs.pillow }}
        run: |
          python -m pip install "Pillow==$PILLOW"
          python 3ds_port/tests/voxel_night_test.py --cc gcc
      - name: Bottom map and clock footer
        run: python 3ds_port/tests/bottom_map_test.py

  build-3ds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            python-version: "3.13"
            python-image: python:3.13.17-slim-bookworm
          - name: candidate
            python-version: "3.15"
            python-image: python:3.15.2-slim-bookworm
    # Not ubuntu-latest: on Ubuntu 26.04 the container's AddressSanitizer
    # builds (pokedex_capture_test.py --sanitize) loop on DEADLYSIGNAL until
    # the runner is lost.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Select the comparison interpreter
        env:
          TRIAL_PYTHON_VERSION: ${{ matrix.python-version }}
          TRIAL_PYTHON_IMAGE: ${{ matrix.python-image }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          lock = Path("upstream.lock")
          source = lock.read_text(encoding="utf-8")
          source = re.sub(r'^version = "3[.]15"$',
                          'version = "' + os.environ["TRIAL_PYTHON_VERSION"] + '"', source, flags=re.M)
          source = source.replace("python:3.15.2-slim-bookworm", os.environ["TRIAL_PYTHON_IMAGE"])
          lock.write_text(source, encoding="utf-8")
          PYTHON
      - name: Build the pinned release environment
        id: release-image
        run: |
          python3 - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          from tools.docker_release import image

          lock = tomllib.loads(Path("upstream.lock").read_text(encoding="utf-8"))
          tag = image(lock)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"tag={tag}", file=output)
          PYTHON
      - name: Build and verify the engine in the release environment
        env:
          RELEASE_IMAGE: ${{ steps.release-image.outputs.tag }}
        run: |
          docker run --rm -i --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$RELEASE_IMAGE" bash -e <<'BUILD'
          echo "::group::Bootstrap and build"
          python3 -m py_compile tools/port_common/gen_asset_table.py
          python3 builder/tests/test_asset_table_compatibility.py
          python3 tools/bootstrap.py --make -j4 --python python3
          echo "::endgroup::"

          echo "::group::Host tests and link audit"
          make -C build/upstream/3ds_port verify PYTHON=python3
          echo "::endgroup::"

          echo "::group::Production encounter and berry clock tests"
          python3 3ds_port/tests/encounter_tables_test.py --tree build/upstream
          python3 3ds_port/tests/berry_clock_test.py --tree build/upstream
          echo "::endgroup::"

          echo "::group::Engine-only 3DSX and publication audit"
          make -C build/upstream/3ds_port release PYTHON=python3
          mkdir -p ship
          cp build/upstream/3ds_port/dist/Emerald3DS.3dsx build/upstream/3ds_port/dist/Emerald3DS.smdh ship/
          # In payload/, where the release ships them (release_audit_allow.toml [large]).
          python3 -c "import zipfile,pathlib; z=zipfile.ZipFile('ship.zip','w'); [z.write(p, 'payload/' + p.name) for p in pathlib.Path('ship').iterdir()]"
          python3 tools/release_audit.py --zip ship.zip --strict
          (
            cd build/upstream/3ds_port/romfs
            find voxel -type f -print0 | sort -z | xargs -0 sha256sum
          ) > voxel.sha256
          echo "::endgroup::"
          BUILD
      - uses: actions/upload-artifact@v4
        with:
          name: emerald3ds-engine-${{ matrix.name }}
          path: ship/
      - uses: actions/upload-artifact@v4
        with:
          name: voxel-checksums-${{ matrix.name }}
          path: voxel.sha256
          if-no-files-found: error

  compare-voxel-output:
    needs: build-3ds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voxel-checksums-baseline
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: voxel-checksums-candidate
          path: candidate
      - name: Compare generated voxel file hashes
        run: diff -u baseline/voxel.sha256 candidate/voxel.sha256

  windows-builder-smoke:
    needs: release-versions
    runs-on: windows-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.release-versions.outputs.python }}
      - name: Install builder packaging tools
        env:
          PILLOW: ${{ needs.release-versions.outputs.pillow }}
        run: python -m pip install "Pillow==$env:PILLOW" "PyInstaller==6.22.3"
      - name: Freeze the Windows builder
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          python -c "import sys; from pathlib import Path; sys.path.insert(0, '../tools'); from build_release import GENERATORS, local_closure; _, external = local_closure(Path('../3ds_port/scripts'), GENERATORS); Path('build/hidden-imports.txt').write_text('\n'.join(sorted(external)), encoding='utf-8')"
          python -m PyInstaller --noconfirm --clean emerald3ds-builder.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\Emerald3DS-Builder\emerald3ds-builder-cli.exe --help
